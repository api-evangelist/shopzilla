name: Shopzilla
description: >-
  Shopzilla is a comparison-shopping brand that lets consumers search across
  thousands of merchants to compare products, prices, and merchant ratings.
  Originally launched as BizRate and later Shopzilla, Inc., the business
  rebranded its corporate entity to Connexity in 2014 and is today operated by
  Connexity, a Taboola company, alongside sibling properties such as Bizrate,
  Beso, and PriceGrabber. Shopzilla itself publishes no API: no Shopzilla-branded
  developer host resolves in DNS (developer.shopzilla.com, api.shopzilla.com and
  docs.shopzilla.com are all NXDOMAIN), and www.shopzilla.com sits behind an AWS
  CloudFront WAF that bot-challenges the root and returns HTTP 403 on every other
  path, including all /.well-known/ locations. The publisher/affiliate API program
  that was historically marketed as the Shopzilla Publisher Program is today
  published under the CONNEXITY brand, on Connexity-owned hosts, and is deliberately
  not catalogued here: the docs are titled "Connexity Monetization API", list
  info@connexity.com as the contact, and are served from api.cnnx.link and
  publisher-api.connexity.com. The legacy Catalog API host catalog.bizrate.com does
  still answer, but returns bare Tomcat errors and publishes no specification. This
  profile was surfaced as a portfolio company of Norwest Venture Partners; the
  2026-08-13 enrichment pass probed 18 paths across three hosts, swept five package
  registries, and found no Shopzilla developer surface of any kind.
