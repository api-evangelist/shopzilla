name: Shopzilla
description: >-
  Shopzilla is a comparison-shopping brand that lets consumers search across
  thousands of merchants to compare products, prices, and merchant ratings.
  Originally launched as BizRate and later Shopzilla, Inc., the business
  rebranded its corporate entity to Connexity in 2014 and is today operated by
  Connexity, a Taboola company, alongside sibling properties such as Bizrate,
  Beso, and PriceGrabber. Historically Shopzilla ran the Shopzilla Publisher
  Program, a CPC affiliate program whose Catalog API (the Bizrate and Beso APIs)
  exposed catalogued products, merchant offers, and ratings/reviews over a
  query-based RESTful web service returning XML or JSON. That legacy publisher
  API is no longer a documented, publicly onboardable developer program; the
  consumer shopzilla.com site remains live but publishes no current public API,
  developer portal, or OpenAPI. This profile was surfaced as a portfolio
  company of Norwest Venture Partners and enriched with a domain-security probe
  pending any future public API surface.
